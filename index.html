<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manajemen Data Skincare</title>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background-color: #fff8f6;
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 30px;
    }
    h1 {
      color: #d17a6e;
      margin-bottom: 20px;
    }
    .container {
      background: #fff;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      width: 420px;
    }
    input, button {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border-radius: 8px;
      border: 1px solid #ddd;
    }
    button {
      background-color: #d17a6e;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }
    button:hover {
      background-color: #c06a5e;
    }
    ul {
      list-style-type: none;
      padding: 0;
    }
    li {
      background-color: #ffe4dd;
      margin: 5px 0;
      padding: 10px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .delete-btn {
      background: #ff6b6b;
      color: white;
      border: none;
      padding: 5px 8px;
      border-radius: 5px;
      cursor: pointer;
    }
    .delete-btn:hover {
      background: #e05656;
    }
  </style>
</head>
<body>
  <h1>Manajemen Data Skincare</h1>
  <div class="container">
    <input type="text" id="namaSkincare" placeholder="Masukkan nama produk skincare...">
    <input type="number" id="stokSkincare" placeholder="Masukkan jumlah stok...">
    <button id="tambahBtn">Tambah Produk</button>

    <h3>Daftar Produk Skincare</h3>
    <ul id="daftarSkincare"></ul>
  </div>

  <script src="script.js"></script>
</body>
</html>
